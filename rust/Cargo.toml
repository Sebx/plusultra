[package]
name = "plusultra"
version = "0.1.0"
edition = "2021"
authors = ["plusultra contributors"]
license = "MIT"
description = "Local text classification engine - native Rust runtime"

[dependencies]
ort = { version = "2.1", features = ["cuda", "tensorrt"] }
tokenizers = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
log = "0.4"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"  # Progress bars

[[bin]]
name = "plusultra"
path = "src/main.rs"

[lib]
name = "plusultra"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
